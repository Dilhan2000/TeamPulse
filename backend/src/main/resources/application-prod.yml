# ─── Datasource ──────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health

# ─── App-specific properties ─────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cookie:
    secure: true                   # HTTPS required in prod
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN}
  timezone: UTC
  ai:
    enabled: ${ANTHROPIC_API_KEY:false}
    model: ${AI_MODEL:claude-opus-4-5}
    max-tokens: ${AI_MAX_TOKENS:2048}
    max-tool-iterations: 5

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.shan.weeklyreport: INFO
