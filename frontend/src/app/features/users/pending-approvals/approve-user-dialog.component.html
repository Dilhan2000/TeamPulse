<h2 mat-dialog-title>Approve Registration</h2>
    <mat-dialog-content>
      <p>
        Approve registration for <strong>{{ data.user.fullName }}</strong> ({{ data.user.email }}).
      </p>

      <form [formGroup]="form" class="mt-md">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Assigned Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="TEAM_MEMBER">Team Member</mat-option>
            <mat-option value="MANAGER">Manager</mat-option>
          </mat-select>
        </mat-form-field>
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancel</button>
      <button mat-flat-button color="primary" (click)="onConfirm()">Approve User</button>
    </mat-dialog-actions>
