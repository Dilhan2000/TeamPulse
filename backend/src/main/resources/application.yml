spring:
  application:
    name: weeklyreport
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: ${app.timezone:UTC}

app:
  timezone: ${APP_TIMEZONE:UTC}
  ai:
    enabled: false
    model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
    max-tokens: 2048
    max-tool-iterations: 5
