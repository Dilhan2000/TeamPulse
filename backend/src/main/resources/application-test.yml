spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${TEST_DB_NAME:teamplan_test}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:teamplan_admin}
    password: ${DB_PASSWORD:Abc@123#$}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cookie:
    secure: false
  cors:
    allowed-origin: http://localhost:4200
  timezone: UTC
  ai:
    enabled: false
