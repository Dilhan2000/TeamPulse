# ─── Datasource (local MySQL) ─────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teamplan}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:teamplan_admin}
    password: ${DB_PASSWORD:Abc@123#$}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ─── Flyway ──────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health

# ─── App-specific properties ─────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars-long-for-hs256}  # Must be >= 32 chars — set in .env
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cookie:
    secure: false                  # false in dev — HTTPS not used locally
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
  timezone: UTC
  ai:
    enabled: false                 # Overridden to true when ANTHROPIC_API_KEY is set
    model: claude-opus-4-5
    max-tokens: 2048
    max-tool-iterations: 5

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.shan.weeklyreport: DEBUG
